name: Daily Download freenode.yaml

on:
  schedule:
    # 北京时间每天 10:00 (UTC 02:00)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download freenode.yaml
        run: |
          TZ='Asia/Shanghai'
          YEAR=$(TZ=$TZ date +'%Y')
          MONTH=$(TZ=$TZ date +'%m')
          DATE8=$(TZ=$TZ date +'%Y%m%d')
          URL="https://static.v2rayshare.net/${YEAR}/${MONTH}/${DATE8}.yaml"
          echo "Downloading from: $URL"
          curl -L -f "$URL" -o freenode.yaml
          test -s freenode.yaml && echo "OK" || { echo "Download failed"; exit 1; }

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add freenode.yaml

          if git diff --cached --quiet; then
            echo "No changes to freenode.yaml, skipping commit"
            exit 0
          fi

          git commit -m "Update freenode.yaml $(date '+%Y-%m-%d %H:%M:%S')"

          git pull --rebase origin ${{ github.ref_name }} || {
            echo "Git pull failed"
            exit 1
          }

          git push origin ${{ github.ref_name }}
