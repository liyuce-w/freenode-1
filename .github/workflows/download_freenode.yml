name: Daily Download freenode.yaml

on:
  schedule:
    # 北京时间每天 10:00 运行 (UTC 2:00)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - show repo layout
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== root ==="
          ls -la
          echo "=== scripts dir ==="
          ls -la scripts/ || echo "scripts/ NOT FOUND"
          echo "=== find download.sh ==="
          find . -name "download.sh" -not -path "./.git/*"
          echo "=== file type ==="
          file scripts/download.sh || true

      - name: Fix line endings (CRLF -> LF)
        run: |
          sed -i 's/\r$//' scripts/download.sh
          chmod +x scripts/download.sh

      - name: Run download script
        run: bash scripts/download.sh

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff --quiet freenode.yaml; then
            echo "No changes to freenode.yaml, skipping commit"
            exit 0
          fi
          git add freenode.yaml
          git commit -m "Update freenode.yaml $(date '+%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin ${{ github.ref_name }} || {
            echo "❌ Git pull failed, please check conflicts"
            exit 1
          }
          git push origin ${{ github.ref_name }}
